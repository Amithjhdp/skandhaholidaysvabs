<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" role="img" aria-label="Skandha Holidays Cabs premium logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Skandha Holidays Cabs</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E4A6"/>
      <stop offset="0.45" stop-color="#D4A13F"/>
      <stop offset="1" stop-color="#8E6A1F"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14323F"/>
      <stop offset="1" stop-color="#07151D"/>
    </linearGradient>
    <clipPath id="badge">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
  </defs>

  <!-- Emblem -->
  <circle cx="50" cy="50" r="43" fill="url(#navy)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.8"/>

  <g clip-path="url(#badge)">
    <!-- sparkle -->
    <path d="M70 18 L72 24 L78 26 L72 28 L70 34 L68 28 L62 26 L68 24 Z" fill="url(#gold)"/>
    <!-- road -->
    <path d="M26 77 L74 77" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- roof sign -->
    <rect x="44" y="34" width="14" height="6.5" rx="2" fill="#F6E7B4"/>
    <!-- car body -->
    <path d="M17 63 L17 57 Q17 53.5 21 52.5 L30 50.5 L38 42.5 Q40 40.5 43 40.5 L60 40.5 Q63 40.5 65 42.5 L72 50.5 L79 52.5 Q83 53.5 83 57 L83 63 Z" fill="url(#gold)"/>
    <!-- windows -->
    <path d="M38.5 50 L44 43.5 L49 43.5 L49 50 Z" fill="#07151D"/>
    <path d="M52 43.5 L59.5 43.5 L65.5 50 L52 50 Z" fill="#07151D"/>
    <!-- wheels -->
    <circle cx="32" cy="64" r="7.5" fill="#07151D" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="68" cy="64" r="7.5" fill="#07151D" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="32" cy="64" r="2.3" fill="#F6E4A6"/>
    <circle cx="68" cy="64" r="2.3" fill="#F6E4A6"/>
  </g>

  <!-- Wordmark -->
  <text x="108" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#0B1F2A" textLength="196" lengthAdjust="spacing">SKANDHA</text>
  <path d="M108 62 L304 62" stroke="url(#gold)" stroke-width="1.2"/>
  <text x="108" y="79" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#B8892E" textLength="196" lengthAdjust="spacing">HOLIDAYS CABS</text>
</svg>
